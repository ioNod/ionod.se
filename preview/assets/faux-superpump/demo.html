<!doctype html>
<html class="demo" lang="sv">
<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/jpeg" href="../ionod-logo.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ljungmåla Borra (demo)</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="embedded.css">
    <script defer src="simulator.js"></script>
</head>
<body>
    <main>
        <header class="panel hero">
            <h1>Ljungmåla Borra (demo)</h1>
            <p class="credit"><span id="credit"></span> <img src="ionod-credit.png" alt="IoNod" width="18" height="18"> ioNod.se</p>

            <section class="process fold-card">
                <button id="pumps-toggle" class="fold-toggle" type="button" aria-expanded="false" aria-controls="pumps-fold">
                    <strong id="process-status" class="process-status"><span id="process-state"></span><span id="process-pressure"></span></strong>
                    <span id="pumps" class="pumps"></span>
                </button>
                <div id="pumps-fold" class="fold" inert><div class="fold-clip"><div id="pump-controls" class="pump-controls"></div></div></div>
            </section>

            <section class="events fold-card">
                <button id="events-toggle" class="fold-toggle" type="button" aria-expanded="false" aria-controls="events-fold">
                    <strong id="events-title" class="section-title"></strong>
                </button>
                <ol id="event-preview" class="event-list"></ol>
                <div id="events-fold" class="fold" inert><div class="fold-clip"><ol id="event-list" class="event-list" start="3"></ol></div></div>
            </section>

            <div class="control-panel">
                <div id="commands" class="commands" inert>
                    <button id="start" class="command" type="button"><span class="sculpt" aria-hidden="true"></span><span id="start-label"></span></button>
                    <button id="stop" class="command" type="button"><span class="sculpt" aria-hidden="true"></span><span id="stop-label"></span></button>
                    <button id="reset" class="pill" type="button" hidden></button>
                </div>
                <div id="locked-controls" class="locked-controls">
                    <button id="unlock" class="command" type="button" aria-controls="commands" aria-expanded="false"><span class="sculpt" aria-hidden="true"></span><span id="unlock-label"></span></button>
                </div>
            </div>
        </header>

        <section id="gauges" class="gauges"></section>

        <section class="panel history" aria-labelledby="history-title">
            <h2 id="history-title" class="section-title"></h2>
            <div id="graph-box" class="graph-box">
                <ul id="graph-legend" class="graph-legend"></ul>
                <canvas id="graph" width="640" height="216" role="img"></canvas>
                <div class="graph-time"><span id="graph-start"></span><strong id="graph-readout" hidden></strong><span id="graph-end"></span></div>
            </div>
        </section>

        <section class="panel settings fold-card">
            <button id="settings-toggle" class="fold-toggle" type="button" aria-expanded="false" aria-controls="settings-fold">
                <strong id="settings-title" class="section-title"></strong>
            </button>
            <div class="settings-row pressure-setting">
                <div><span id="setpoint-label"></span> <strong id="setpoint"></strong></div>
                <button id="set-pressure" class="pill" type="button" aria-haspopup="dialog" aria-labelledby="configure-pressure setpoint-label"><span id="configure-pressure"></span></button>
            </div>
            <div id="settings-fold" class="fold" inert><div class="fold-clip">
                <div class="settings-actions">
                    <section class="alarm-group">
                        <div class="settings-row">
                            <h2 id="pressure-alarm-label" class="section-title"></h2>
                            <button id="set-pressure-alarm" class="pill" type="button" aria-haspopup="dialog" aria-labelledby="configure-pressure-alarm pressure-alarm-label"><span id="configure-pressure-alarm"></span></button>
                        </div>
                        <dl id="pressure-alarm-readings" class="alarm-readings"></dl>
                    </section>
                    <section class="alarm-group">
                        <div class="settings-row">
                            <h2 id="flow-alarm-label" class="section-title"></h2>
                            <button id="set-flow-alarm" class="pill" type="button" aria-haspopup="dialog" aria-labelledby="configure-flow-alarm flow-alarm-label"><span id="configure-flow-alarm"></span></button>
                        </div>
                        <dl id="flow-alarm-readings" class="alarm-readings"></dl>
                    </section>
                </div>
            </div></div>
        </section>

        <section class="panel diagnostics-panel">
            <div class="diagnostics-heading">
                <h2 id="diagnostics-title" class="section-title"></h2>
                <button id="report" class="pill" type="button" aria-haspopup="dialog"></button>
            </div>
            <dl class="diagnostics">
                <div><dt id="energy-label"></dt><dd id="energy"></dd></div>
                <div><dt id="volume-label"></dt><dd id="volume"></dd></div>
                <div><dt id="updated-label"></dt><dd><time id="updated"></time></dd></div>
                <div>
                    <dt id="gps-label"></dt>
                    <dd><button id="gps" class="map-link" type="button" aria-haspopup="dialog"></button></dd>
                </div>
            </dl>
            <button id="more" class="pill accent" type="button" aria-haspopup="dialog"></button>
        </section>
    </main>

    <div id="toast" class="toast" role="status" aria-atomic="true">
        <img src="bell.png" alt="">
        <div><strong id="toast-label"></strong><span id="toast-message"></span></div>
    </div>

    <dialog id="unavailable" aria-labelledby="unavailable-title">
        <h2 id="unavailable-title"></h2>
        <ul id="unavailable-list"></ul>
        <form method="dialog"><button id="close" class="pill accent" type="submit" autofocus></button></form>
    </dialog>

    <dialog id="configuration" aria-labelledby="configuration-title">
        <h2 id="configuration-title"></h2>
        <form id="configuration-form">
            <div id="configuration-fields" class="configuration-fields"></div>
            <div class="configuration-actions">
                <button id="cancel-configuration" class="pill" type="button"></button>
                <button id="save-configuration" class="pill accent" type="submit"></button>
            </div>
        </form>
    </dialog>
</body>
</html>
